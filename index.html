<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicFlix - Premium Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">MagicFlix</div>
    <div class="controls">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="profile-icon">
        <i class="fas fa-user"></i>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-gradient"></div>
    <img src="https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/160/1741139420160-i" alt="Featured" class="hero-img">
    <div class="hero-content">
      <h1>Daredevil: Born Again</h1>
      <p>Matt Murdock finds himself on a collision course with Wilson Fisk...</p>
      <div class="hero-buttons">
        <button class="btn play"><i class="fas fa-play"></i> Now Streaming</button>
        <button class="btn info"><i class="fas fa-info-circle"></i> Details</button>
      </div>
    </div>
  </section>

  <!-- Nav Tabs -->
  <nav class="tabs">
    <a href="#" class="tab active">Home</a>
    <a href="#" class="tab">TV Shows</a>
    <a href="#" class="tab">Movies</a>
    <a href="#" class="tab">Originals</a>
    <a href="#" class="tab">My List</a>
  </nav>

  <!-- Carousels -->
  <main>
    <section class="carousel-section">
      <h2>Continue Watching</h2>
      <div class="carousel">
        <div class="card">
          <img src="https://source.unsplash.com/random/200x300/?fantasy" alt="">
          <div class="progress"><div class="progress-fill" style="width:65%"></div></div>
        </div>
        <div class="card">
          <img src="https://source.unsplash.com/random/200x300/?adventure" alt="">
          <div class="progress"><div class="progress-fill" style="width:30%"></div></div>
        </div>
        <div class="card">
          <img src="https://source.unsplash.com/random/200x300/?sci-fi" alt="">
          <div class="progress"><div class="progress-fill" style="width:85%"></div></div>
        </div>
        <div class="card">
          <img src="https://source.unsplash.com/random/200x300/?action" alt="">
          <div class="progress"><div class="progress-fill" style="width:15%"></div></div>
        </div>
      </div>
    </section>

    <!-- Additional sections for Popular, New Releases, Recommended... -->
  </main>

  <!-- Footer Nav -->
  <footer class="footer-nav">
    <a href="#"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="#"><i class="fas fa-search"></i><span>Search</span></a>
    <a href="#"><i class="fas fa-compass"></i><span>Discover</span></a>
    <a href="#"><i class="fas fa-download"></i><span>Downloads</span></a>
  </footer>
</body>
</html>
