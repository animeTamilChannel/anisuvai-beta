<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chess-board {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .square:hover {
            filter: brightness(1.1);
        }
        
        .light {
            background-color: #f0d9b5;
        }
        
        .dark {
            background-color: #b58863;
        }
        
        .selected {
            background-color: rgba(247, 247, 105, 0.7) !important;
        }
        
        .possible-move {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        .possible-capture {
            position: relative;
        }
        
        .possible-capture::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 5px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .notation {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }
        
        .rank {
            left: 5px;
            top: 5px;
        }
        
        .file {
            right: 5px;
            bottom: 5px;
        }
        
        .timer {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: white;
        }
        
        .captured-pieces {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
            min-height: 40px;
            padding: 5px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        
        .captured-piece {
            font-size: 20px;
        }
        
        .promotion-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .promotion-options {
            display: flex;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .promotion-option {
            font-size: 40px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .promotion-option:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="flex flex-col items-center gap-6">
        <h1 class="text-3xl font-bold text-gray-800">Chess Game</h1>
        
        <div class="flex gap-8 items-start">
            <!-- Player 1 (Top) -->
            <div class="flex flex-col items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center">
                        <i class="fas fa-user text-gray-600 text-xl"></i>
                    </div>
                    <div>
                        <p class="font-semibold">Player 1</p>
                        <p class="text-sm text-gray-500">White</p>
                    </div>
                </div>
                <div class="timer">10:00</div>
                <div class="captured-pieces" id="white-captured"></div>
            </div>
            
            <!-- Chess Board -->
            <div class="chess-board" id="chess-board">
                <!-- Squares will be generated by JavaScript -->
            </div>
            
            <!-- Player 2 (Bottom) -->
            <div class="flex flex-col items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center">
                        <i class="fas fa-user text-gray-600 text-xl"></i>
                    </div>
                    <div>
                        <p class="font-semibold">Player 2</p>
                        <p class="text-sm text-gray-500">Black</p>
                    </div>
                </div>
                <div class="timer">10:00</div>
                <div class="captured-pieces" id="black-captured"></div>
            </div>
        </div>
        
        <!-- Game Controls -->
        <div class="flex gap-4 mt-6">
            <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                <i class="fas fa-undo mr-2"></i> Undo
            </button>
            <button class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
                <i class="fas fa-play mr-2"></i> New Game
            </button>
            <button class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">
                <i class="fas fa-flag mr-2"></i> Resign
            </button>
            <button class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 transition">
                <i class="fas fa-cog mr-2"></i> Settings
            </button>
        </div>
    </div>
    
    <!-- Promotion Modal (Hidden by default) -->
    <div class="promotion-modal hidden" id="promotion-modal">
        <div class="promotion-options">
            <div class="promotion-option" data-piece="queen">♕</div>
            <div class="promotion-option" data-piece="rook">♖</div>
            <div class="promotion-option" data-piece="bishop">♗</div>
            <div class="promotion-option" data-piece="knight">♘</div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('chess-board');
            const whiteCaptured = document.getElementById('white-captured');
            const blackCaptured = document.getElementById('black-captured');
            const promotionModal = document.getElementById('promotion-modal');
            
            // Chess game state
            let gameState = {
                board: initializeBoard(),
                selectedSquare: null,
                possibleMoves: [],
                currentPlayer: 'white',
                whiteCaptured: [],
                blackCaptured: [],
                whiteTime: 600, // 10 minutes in seconds
                blackTime: 600,
                gameActive: true
            };
            
            // Initialize the board UI
            renderBoard();
            startTimer();
            
            // Initialize the chess board with starting position
            function initializeBoard() {
                const board = Array(8).fill().map(() => Array(8).fill(null));
                
                // Set up pawns
                for (let i = 0; i < 8; i++) {
                    board[1][i] = { type: 'pawn', color: 'black' };
                    board[6][i] = { type: 'pawn', color: 'white' };
                }
                
                // Set up rooks
                board[0][0] = { type: 'rook', color: 'black' };
                board[0][7] = { type: 'rook', color: 'black' };
                board[7][0] = { type: 'rook', color: 'white' };
                board[7][7] = { type: 'rook', color: 'white' };
                
                // Set up knights
                board[0][1] = { type: 'knight', color: 'black' };
                board[0][6] = { type: 'knight', color: 'black' };
                board[7][1] = { type: 'knight', color: 'white' };
                board[7][6] = { type: 'knight', color: 'white' };
                
                // Set up bishops
                board[0][2] = { type: 'bishop', color: 'black' };
                board[0][5] = { type: 'bishop', color: 'black' };
                board[7][2] = { type: 'bishop', color: 'white' };
                board[7][5] = { type: 'bishop', color: 'white' };
                
                // Set up queens
                board[0][3] = { type: 'queen', color: 'black' };
                board[7][3] = { type: 'queen', color: 'white' };
                
                // Set up kings
                board[0][4] = { type: 'king', color: 'black' };
                board[7][4] = { type: 'king', color: 'white' };
                
                return board;
            }
            
            // Render the chess board UI
            function renderBoard() {
                board.innerHTML = '';
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                        square.dataset.row = row;
                        square.dataset.col = col;
                        
                        // Add notation
                        if (col === 0) {
                            const rank = document.createElement('div');
                            rank.className = 'notation rank';
                            rank.textContent = 8 - row;
                            square.appendChild(rank);
                        }
                        
                        if (row === 7) {
                            const file = document.createElement('div');
                            file.className = 'notation file';
                            file.textContent = String.fromCharCode(97 + col);
                            square.appendChild(file);
                        }
                        
                        // Add piece if exists
                        const piece = gameState.board[row][col];
                        if (piece) {
                            const pieceElement = document.createElement('div');
                            pieceElement.textContent = getPieceSymbol(piece);
                            pieceElement.style.color = piece.color === 'white' ? '#ffffff' : '#000000';
                            square.appendChild(pieceElement);
                        }
                        
                        // Highlight selected square
                        if (gameState.selectedSquare && 
                            gameState.selectedSquare.row === row && 
                            gameState.selectedSquare.col === col) {
                            square.classList.add('selected');
                        }
                        
                        // Highlight possible moves
                        const isPossibleMove = gameState.possibleMoves.some(move => 
                            move.row === row && move.col === col);
                        
                        if (isPossibleMove) {
                            const moveType = gameState.board[row][col] ? 'possible-capture' : 'possible-move';
                            const moveMarker = document.createElement('div');
                            moveMarker.className = moveType;
                            square.appendChild(moveMarker);
                        }
                        
                        square.addEventListener('click', () => handleSquareClick(row, col));
                        board.appendChild(square);
                    }
                }
                
                // Update captured pieces display
                updateCapturedPieces();
            }
            
            // Get Unicode symbol for a piece
            function getPieceSymbol(piece) {
                const symbols = {
                    king: { white: '♔', black: '♚' },
                    queen: { white: '♕', black: '♛' },
                    rook: { white: '♖', black: '♜' },
                    bishop: { white: '♗', black: '♝' },
                    knight: { white: '♘', black: '♞' },
                    pawn: { white: '♙', black: '♟' }
                };
                
                return symbols[piece.type][piece.color];
            }
            
            // Handle square click
            function handleSquareClick(row, col) {
                if (!gameState.gameActive) return;
                
                const piece = gameState.board[row][col];
                
                // If no square is selected and the clicked square has a piece of the current player's color
                if (!gameState.selectedSquare && piece && piece.color === gameState.currentPlayer) {
                    gameState.selectedSquare = { row, col };
                    gameState.possibleMoves = getPossibleMoves(row, col);
                    renderBoard();
                    return;
                }
                
                // If a square is already selected
                if (gameState.selectedSquare) {
                    const { row: selectedRow, col: selectedCol } = gameState.selectedSquare;
                    
                    // If clicking on another piece of the same color, select that piece instead
                    if (piece && piece.color === gameState.currentPlayer) {
                        gameState.selectedSquare = { row, col };
                        gameState.possibleMoves = getPossibleMoves(row, col);
                        renderBoard();
                        return;
                    }
                    
                    // Check if the move is valid
                    const isValidMove = gameState.possibleMoves.some(move => 
                        move.row === row && move.col === col);
                    
                    if (isValidMove) {
                        // Handle pawn promotion
                        if (gameState.board[selectedRow][selectedCol].type === 'pawn' && 
                            (row === 0 || row === 7)) {
                            showPromotionModal(selectedRow, selectedCol, row, col);
                            return;
                        }
                        
                        makeMove(selectedRow, selectedCol, row, col);
                    } else {
                        // Invalid move, deselect
                        gameState.selectedSquare = null;
                        gameState.possibleMoves = [];
                        renderBoard();
                    }
                }
            }
            
            // Get possible moves for a piece (simplified for demo)
            function getPossibleMoves(row, col) {
                const piece = gameState.board[row][col];
                if (!piece) return [];
                
                const moves = [];
                
                // Simplified movement rules for demo
                switch (piece.type) {
                    case 'pawn':
                        const direction = piece.color === 'white' ? -1 : 1;
                        
                        // Forward move
                        if (isValidSquare(row + direction, col) && !gameState.board[row + direction][col]) {
                            moves.push({ row: row + direction, col });
                            
                            // Double move from starting position
                            const startRow = piece.color === 'white' ? 6 : 1;
                            if (row === startRow && !gameState.board[row + 2 * direction][col]) {
                                moves.push({ row: row + 2 * direction, col });
                            }
                        }
                        
                        // Captures
                        for (const colOffset of [-1, 1]) {
                            const newCol = col + colOffset;
                            if (isValidSquare(row + direction, newCol) && 
                                gameState.board[row + direction][newCol] && 
                                gameState.board[row + direction][newCol].color !== piece.color) {
                                moves.push({ row: row + direction, col: newCol });
                            }
                        }
                        break;
                        
                    case 'rook':
                        addStraightMoves(row, col, piece.color, moves);
                        break;
                        
                    case 'knight':
                        for (const [rowOffset, colOffset] of [[2, 1], [1, 2], [-1, 2], [-2, 1], 
                                                              [-2, -1], [-1, -2], [1, -2], [2, -1]]) {
                            const newRow = row + rowOffset;
                            const newCol = col + colOffset;
                            
                            if (isValidSquare(newRow, newCol) && 
                                (!gameState.board[newRow][newCol] || 
                                 gameState.board[newRow][newCol].color !== piece.color)) {
                                moves.push({ row: newRow, col: newCol });
                            }
                        }
                        break;
                        
                    case 'bishop':
                        addDiagonalMoves(row, col, piece.color, moves);
                        break;
                        
                    case 'queen':
                        addStraightMoves(row, col, piece.color, moves);
                        addDiagonalMoves(row, col, piece.color, moves);
                        break;
                        
                    case 'king':
                        for (let r = -1; r <= 1; r++) {
                            for (let c = -1; c <= 1; c++) {
                                if (r === 0 && c === 0) continue;
                                
                                const newRow = row + r;
                                const newCol = col + c;
                                
                                if (isValidSquare(newRow, newCol) && 
                                    (!gameState.board[newRow][newCol] || 
                                     gameState.board[newRow][newCol].color !== piece.color)) {
                                    moves.push({ row: newRow, col: newCol });
                                }
                            }
                        }
                        break;
                }
                
                return moves;
            }
            
            // Helper function to add straight moves (for rook and queen)
            function addStraightMoves(row, col, color, moves) {
                // Up
                for (let r = row - 1; r >= 0; r--) {
                    if (!gameState.board[r][col]) {
                        moves.push({ row: r, col });
                    } else {
                        if (gameState.board[r][col].color !== color) {
                            moves.push({ row: r, col });
                        }
                        break;
                    }
                }
                
                // Down
                for (let r = row + 1; r < 8; r++) {
                    if (!gameState.board[r][col]) {
                        moves.push({ row: r, col });
                    } else {
                        if (gameState.board[r][col].color !== color) {
                            moves.push({ row: r, col });
                        }
                        break;
                    }
                }
                
                // Left
                for (let c = col - 1; c >= 0; c--) {
                    if (!gameState.board[row][c]) {
                        moves.push({ row, col: c });
                    } else {
                        if (gameState.board[row][c].color !== color) {
                            moves.push({ row, col: c });
                        }
                        break;
                    }
                }
                
                // Right
                for (let c = col + 1; c < 8; c++) {
                    if (!gameState.board[row][c]) {
                        moves.push({ row, col: c });
                    } else {
                        if (gameState.board[row][c].color !== color) {
                            moves.push({ row, col: c });
                        }
                        break;
                    }
                }
            }
            
            // Helper function to add diagonal moves (for bishop and queen)
            function addDiagonalMoves(row, col, color, moves) {
                // Up-left
                for (let r = row - 1, c = col - 1; r >= 0 && c >= 0; r--, c--) {
                    if (!gameState.board[r][c]) {
                        moves.push({ row: r, col: c });
                    } else {
                        if (gameState.board[r][c].color !== color) {
                            moves.push({ row: r, col: c });
                        }
                        break;
                    }
                }
                
                // Up-right
                for (let r = row - 1, c = col + 1; r >= 0 && c < 8; r--, c++) {
                    if (!gameState.board[r][c]) {
                        moves.push({ row: r, col: c });
                    } else {
                        if (gameState.board[r][c].color !== color) {
                            moves.push({ row: r, col: c });
                        }
                        break;
                    }
                }
                
                // Down-left
                for (let r = row + 1, c = col - 1; r < 8 && c >= 0; r++, c--) {
                    if (!gameState.board[r][c]) {
                        moves.push({ row: r, col: c });
                    } else {
                        if (gameState.board[r][c].color !== color) {
                            moves.push({ row: r, col: c });
                        }
                        break;
                    }
                }
                
                // Down-right
                for (let r = row + 1, c = col + 1; r < 8 && c < 8; r++, c++) {
                    if (!gameState.board[r][c]) {
                        moves.push({ row: r, col: c });
                    } else {
                        if (gameState.board[r][c].color !== color) {
                            moves.push({ row: r, col: c });
                        }
                        break;
                    }
                }
            }
            
            // Check if square is valid
            function isValidSquare(row, col) {
                return row >= 0 && row < 8 && col >= 0 && col < 8;
            }
            
            // Make a move on the board
            function makeMove(fromRow, fromCol, toRow, toCol, promotionType = 'queen') {
                const piece = gameState.board[fromRow][fromCol];
                
                // Handle capture
                if (gameState.board[toRow][toCol]) {
                    const capturedPiece = gameState.board[toRow][toCol];
                    if (capturedPiece.color === 'white') {
                        gameState.whiteCaptured.push(capturedPiece);
                    } else {
                        gameState.blackCaptured.push(capturedPiece);
                    }
                }
                
                // Handle pawn promotion
                if (piece.type === 'pawn' && (toRow === 0 || toRow === 7)) {
                    gameState.board[toRow][toCol] = { type: promotionType, color: piece.color };
                } else {
                    gameState.board[toRow][toCol] = piece;
                }
                
                gameState.board[fromRow][fromCol] = null;
                
                // Switch player
                gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                
                // Reset selection
                gameState.selectedSquare = null;
                gameState.possibleMoves = [];
                
                renderBoard();
                
                // Check for game over conditions (simplified for demo)
                checkGameOver();
            }
            
            // Show promotion modal
            function showPromotionModal(fromRow, fromCol, toRow, toCol) {
                promotionModal.classList.remove('hidden');
                
                const options = promotionModal.querySelectorAll('.promotion-option');
                options.forEach(option => {
                    option.addEventListener('click', () => {
                        const promotionType = option.dataset.piece;
                        makeMove(fromRow, fromCol, toRow, toCol, promotionType);
                        promotionModal.classList.add('hidden');
                    });
                });
            }
            
            // Update captured pieces display
            function updateCapturedPieces() {
                whiteCaptured.innerHTML = '';
                blackCaptured.innerHTML = '';
                
                gameState.whiteCaptured.forEach(piece => {
                    const pieceElement = document.createElement('div');
                    pieceElement.className = 'captured-piece';
                    pieceElement.textContent = getPieceSymbol(piece);
                    pieceElement.style.color = '#000000';
                    whiteCaptured.appendChild(pieceElement);
                });
                
                gameState.blackCaptured.forEach(piece => {
                    const pieceElement = document.createElement('div');
                    pieceElement.className = 'captured-piece';
                    pieceElement.textContent = getPieceSymbol(piece);
                    pieceElement.style.color = '#ffffff';
                    blackCaptured.appendChild(pieceElement);
                });
            }
            
            // Check for game over conditions
            function checkGameOver() {
                // Simplified - just check if kings are captured
                let whiteKingExists = false;
                let blackKingExists = false;
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = gameState.board[row][col];
                        if (piece && piece.type === 'king') {
                            if (piece.color === 'white') whiteKingExists = true;
                            else blackKingExists = true;
                        }
                    }
                }
                
                if (!whiteKingExists) {
                    alert('Black wins by checkmate!');
                    gameState.gameActive = false;
                } else if (!blackKingExists) {
                    alert('White wins by checkmate!');
                    gameState.gameActive = false;
                }
            }
            
            // Timer functionality
            function startTimer() {
                setInterval(() => {
                    if (!gameState.gameActive) return;
                    
                    if (gameState.currentPlayer === 'white') {
                        gameState.whiteTime--;
                    } else {
                        gameState.blackTime--;
                    }
                    
                    updateTimers();
                    
                    // Check for time out
                    if (gameState.whiteTime <= 0) {
                        alert('Black wins on time!');
                        gameState.gameActive = false;
                    } else if (gameState.blackTime <= 0) {
                        alert('White wins on time!');
                        gameState.gameActive = false;
                    }
                }, 1000);
            }
            
            function updateTimers() {
                const whiteTimer = document.querySelector('.flex.flex-col.items-center.gap-4 .timer');
                const blackTimer = document.querySelector('.flex.flex-col.items-center.gap-4:nth-child(3) .timer');
                
                whiteTimer.textContent = formatTime(gameState.whiteTime);
                blackTimer.textContent = formatTime(gameState.blackTime);
            }
            
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            
            // Button event listeners
            document.querySelector('button:nth-child(1)').addEventListener('click', () => {
                alert('Undo functionality would be implemented here');
            });
            
            document.querySelector('button:nth-child(2)').addEventListener('click', () => {
                if (confirm('Start a new game?')) {
                    gameState = {
                        board: initializeBoard(),
                        selectedSquare: null,
                        possibleMoves: [],
                        currentPlayer: 'white',
                        whiteCaptured: [],
                        blackCaptured: [],
                        whiteTime: 600,
                        blackTime: 600,
                        gameActive: true
                    };
                    renderBoard();
                }
            });
            
            document.querySelector('button:nth-child(3)').addEventListener('click', () => {
                if (confirm('Are you sure you want to resign?')) {
                    const winner = gameState.currentPlayer === 'white' ? 'Black' : 'White';
                    alert(`${winner} wins by resignation!`);
                    gameState.gameActive = false;
                }
            });
            
            document.querySelector('button:nth-child(4)').addEventListener('click', () => {
                alert('Settings would be implemented here');
            });
        });
    </script>
</body>
</html>
